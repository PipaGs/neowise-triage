<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #note { color: #8a1f11; }
    #topic { font-weight: 600; }
    #draft { white-space: pre-wrap; background: #f4f4f4; padding: .75rem; border-radius: .35rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section aria-live="polite">
    <p id="note" hidden></p>
    <p id="topic" hidden></p>
    <pre id="draft" hidden></pre>
  </section>
  <script type="module">
    import { renderTriage } from "/ui.mjs";

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const message = document.querySelector("#message");
    const view = {
      note: document.querySelector("#note"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      try {
        const response = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        renderTriage(await response.json(), view);
      } catch {
        renderTriage({ status: "failed" }, view);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
